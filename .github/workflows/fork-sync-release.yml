name: Fork senkron + dublaj eklentili release

# zoga2o3-ops/Nuvio-One YENİ BİR SÜRÜM yayınlayınca: o sürümün kodunu al, dub-addon/ eklentisini
# (ses arama + senkron) üstüne uygula, imzalı APK derle ve BU depoda GitHub Release olarak yayınla.
# Uygulamadaki güncelleyici bu deponun release'ine bakar (-PlivetvUpdateRepo).
# Çakışma olursa yeni sürüm yayınlanmaz, eskisi çalışmaya devam eder ve issue açılır.

on:
  schedule:
    - cron: "17 3 * * *"        # her gün 03:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Değişiklik olmasa da yeniden derle"
        type: boolean
        default: false
      fork_ref:
        description: "Boş bırak = fork'un son release'i. Doldurursan o etiket/dal kullanılır"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-sync-release
  cancel-in-progress: false

env:
  FORK_REPO: zoga2o3-ops/Nuvio-One
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Bu depo (dub-addon dosyaları)
        uses: actions/checkout@v4
        with:
          path: addon

      - name: Depo hareketsiz kalmasın (GitHub 60 gün kuralı)
        if: github.event_name == 'schedule'
        working-directory: addon
        run: |
          last="$(gh api "repos/${GITHUB_REPOSITORY}/branches/keepalive" --jq '.commit.commit.committer.date' 2>/dev/null || true)"
          case "$last" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-*) ;; *) last="" ;; esac
          if [ -z "$last" ] || [ $(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 )) -ge 30 ]; then
            export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
            export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
            empty_tree="$(git mktree </dev/null)"
            commit="$(git commit-tree "$empty_tree" -m "keepalive $(date -u +%F)")"
            git push -q -f origin "${commit}:refs/heads/keepalive" || echo "::warning::keepalive dalı gönderilemedi"
          fi

      - name: Fork'un kullanılacak sürümü
        id: fork
        env:
          FORK_REF_INPUT: ${{ inputs.fork_ref }}
        run: |
          if [ -n "${FORK_REF_INPUT}" ]; then
            ref="${FORK_REF_INPUT}"
          else
            ref="$(gh api "repos/${FORK_REPO}/releases?per_page=10" \
                     --jq '[.[] | select(.draft == false)][0].tag_name')"
          fi
          [ -n "$ref" ] && [ "$ref" != "null" ] || { echo "::error::Fork'ta release bulunamadı"; exit 1; }
          echo "Fork sürümü: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # Sürüm adında kullanılacak hâli (baştaki v atılır, / gibi karakterler - olur)
          tag="$(printf '%s' "$ref" | sed -E 's/^v//; s#[^A-Za-z0-9._-]#-#g')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Fork kodu (o sürüm, tam geçmiş, 3-way birleştirme için)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ steps.fork.outputs.ref }}
          fetch-depth: 0
          path: src

      - name: Değişiklik var mı?
        id: check
        run: |
          fork_sha="$(git -C src rev-parse HEAD)"
          addon_hash="$(git -C addon ls-tree -r HEAD dub-addon | sha1sum | cut -c1-12)"
          key="${fork_sha:0:12}-${addon_hash}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "fork_sha=${fork_sha}" >> "$GITHUB_OUTPUT"
          bodies="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" --jq '.[].body')"
          if grep -q "dub-build-key: ${key}" <<<"${bodies}" && [ "${{ inputs.force }}" != "true" ]; then
            echo "Yeni bir şey yok (${key}), atlanıyor."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Eklenti sürüm sayacı
        if: steps.check.outputs.skip == 'false'
        id: rev
        run: |
          t="$(printf '%s' "${{ steps.fork.outputs.tag }}" | sed 's/[.]/\\./g')"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' \
                      | grep -cE "^v${t}\.dub\.[0-9]+$" || true)"
          echo "rev=$((existing + 1))" >> "$GITHUB_OUTPUT"

      - name: Eklentiyi uygula
        if: steps.check.outputs.skip == 'false'
        id: apply
        env:
          DUB_FORK_MODE: "1"
          DUB_FORK_TAG: ${{ steps.fork.outputs.tag }}
          DUB_REV: ${{ steps.rev.outputs.rev }}
        run: |
          set -o pipefail
          bash addon/dub-addon/apply.sh src | tee apply.log
          echo "version_name=$(sed -n 's/^VERSION_NAME=//p' apply.log)" >> "$GITHUB_OUTPUT"
          echo "build_number=$(sed -n 's/^BUILD_NUMBER=//p' apply.log)" >> "$GITHUB_OUTPUT"

      - name: Çakışma olursa issue aç
        if: failure() && steps.apply.outcome == 'failure'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          title="Dublaj eklentisi güncel Nuvio-One ile birleşemedi"
          body="Fork sürümü ${{ steps.fork.outputs.ref }} üstüne yamalar uygulanamadı. Yeni APK yayınlanmadı, eski sürüm çalışmaya devam eder.

          Çalıştırma: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          open_issue="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          [ -n "${open_issue}" ] || gh issue create --title "${title}" --body "${body}"

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/**/*.gradle*

      - name: Uygulama anahtarları (local.properties)
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        env:
          NUVIO_BACKEND_URL: ${{ secrets.NUVIO_BACKEND_URL }}
          NUVIO_BACKEND_KEY: ${{ secrets.NUVIO_BACKEND_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
        run: |
          : > keys.properties
          add() { if [ -n "$2" ]; then echo "$1=$2" >> keys.properties; fi; }
          if [ -n "$NUVIO_BACKEND_URL" ]; then
            BACKEND="${NUVIO_BACKEND_URL%/}"
            add NUVIO_SUPABASE_URL "$BACKEND"
            add NUVIO_SUPABASE_ANON_KEY "$NUVIO_BACKEND_KEY"
            case "$BACKEND" in
              *api.nuvio.tv*) ;;
              *)
                add TV_LOGIN_WEB_BASE_URL "$BACKEND/tv-login"
                add DEVICE_LOGIN_WEB_BASE_URL "$BACKEND/link"
                add AVATAR_PUBLIC_BASE_URL "$BACKEND/storage/v1/object/public/avatars"
                ;;
            esac
          fi
          add TMDB_API_KEY "$TMDB_API_KEY"
          add TRAKT_CLIENT_ID "$TRAKT_CLIENT_ID"
          add TRAKT_CLIENT_SECRET "$TRAKT_CLIENT_SECRET"
          add SIMKL_CLIENT_ID "$SIMKL_CLIENT_ID"
          add SIMKL_APP_NAME "$SIMKL_APP_NAME"
          add MDBLIST_CLIENT_ID "$MDBLIST_CLIENT_ID"
          add GOOGLE_DRIVE_CLIENT_ID "$GOOGLE_DRIVE_CLIENT_ID"
          add GOOGLE_DRIVE_CLIENT_SECRET "$GOOGLE_DRIVE_CLIENT_SECRET"
          add PREMIUMIZE_CLIENT_ID "$PREMIUMIZE_CLIENT_ID"
          add IMDB_RATINGS_API_BASE_URL "$IMDB_RATINGS_API_BASE_URL"
          add IMDB_TAPFRAME_API_BASE_URL "$IMDB_TAPFRAME_API_BASE_URL"
          add INTRODB_API_URL "${INTRODB_API_URL:-https://api.introdb.app/}"
          cp keys.properties local.properties
          cp keys.properties local.dev.properties
          rm keys.properties
          echo "Keys set:"; cut -d= -f1 local.properties

      # Fork'un kendi anahtarı (fork kodunda keystore/livetv-fork.jks). Fork'un kendi derlemeleriyle
      # aynı anahtar olduğu için mevcut kurulumlar bu sürümle güncellenebilir.
      - name: İmza
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        env:
          LIVETV_KEYSTORE_BASE64: ${{ secrets.LIVETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LIVETV_KEYSTORE_BASE64" ]; then
            printf '%s' "$LIVETV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/key.jks"
          else
            cp keystore/livetv-fork.jks "$RUNNER_TEMP/key.jks"
          fi
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/key.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=livetvfork"
            echo "NUVIO_RELEASE_STORE_PASSWORD=livetvfork"
          } >> "$GITHUB_ENV"

      - name: Derle (full release APK)
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullRelease --stacktrace \
            -PlivetvUpdateRepo=${{ github.repository }} \
            -PlivetvVersionName=${{ steps.apply.outputs.version_name }} \
            -PlivetvBuildNumber=${{ steps.apply.outputs.build_number }}

      - name: Release yayınla
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        env:
          TAG: v${{ steps.apply.outputs.version_name }}
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/full/release -maxdepth 1 -name '*.apk' | sort)
          (( ${#apks[@]} > 0 )) || { echo "::error::APK üretilmedi"; exit 1; }
          cat > notes.md <<NOTES
          Nuvio-One ${{ steps.fork.outputs.ref }} + Türkçe dublaj (ses arama + senkron).

          Fork commit: ${{ steps.check.outputs.fork_sha }}
          Eklenti sürümü: ${{ steps.rev.outputs.rev }}

          <!-- dub-build-key: ${{ steps.check.outputs.key }} -->
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "${GITHUB_SHA}" --title "Nuvio TV + Dublaj ${TAG#v}" \
            --notes-file notes.md --latest "${apks[@]}"
